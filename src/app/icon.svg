<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer dotted orbit -->
  <circle cx="50" cy="50" r="43" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 4" />
  
  <!-- Horizontal ellipse orbit (0 deg, navy) -->
  <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(0 50 50)" stroke="#071126" stroke-width="3.2" />
  
  <!-- Diagonal ellipse orbit (60 deg, quantum purple) -->
  <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(60 50 50)" stroke="#6D32D9" stroke-width="3.2" />
  
  <!-- Diagonal ellipse orbit (120 deg, navy) -->
  <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(120 50 50)" stroke="#071126" stroke-width="3.2" />
  
  <!-- Center nucleus -->
  <circle cx="50" cy="50" r="6.5" fill="#6D32D9" stroke="#071126" stroke-width="2" />
</svg>
